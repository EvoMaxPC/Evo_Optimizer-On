name: release-exe

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/ab2d6de7-evo-optimizer-on'
    paths:
      - 'src/**'
      - 'catalog/**'
      - '.github/workflows/release-exe.yml'

permissions:
  contents: write

jobs:
  publish-win-x64:
    name: Publish exe win-x64
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      CI: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish Evo.App win-x64 self-contained single file
        shell: pwsh
        run: |
          dotnet publish src/Evo.App -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish/win-x64

      - name: Verify publish output
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path publish/win-x64 -Filter *.exe -File -ErrorAction SilentlyContinue
          if (-not $exe) {
            Write-Error "No exe found in publish/win-x64."
            exit 1
          }
          Write-Host "EXE found: $($exe.Name)"
          $catalogDir = Join-Path -Path (Get-Location) -ChildPath 'publish/win-x64/catalog'
          if (-not (Test-Path -Path $catalogDir)) {
            Write-Error "catalog folder not found inside publish/win-x64."
            exit 1
          }
          Write-Host "catalog folder present."

      - name: Create zip and sha256
        shell: pwsh
        run: |
          $zipPath = 'EvoClean-preview-win-x64.zip'
          if (Test-Path -Path $zipPath) { Remove-Item -Path $zipPath -Force }
          Compress-Archive -Path 'publish/win-x64/*' -DestinationPath $zipPath -Force
          $hash = Get-FileHash -Path $zipPath -Algorithm SHA256
          $hash.Hash | Out-File -FilePath "$zipPath.sha256" -Encoding ascii -NoNewline
          Write-Host "ZIP: $zipPath"
          Write-Host "SHA256: $($hash.Hash)"
          Write-Host "Size: $((Get-Item $zipPath).Length) bytes"

      - name: Job summary
        shell: pwsh
        run: |
          $zipPath = 'EvoClean-preview-win-x64.zip'
          $size = (Get-Item $zipPath).Length
          $sha256 = Get-Content -Path "$zipPath.sha256" -Raw
          $files = Get-ChildItem -Path 'publish/win-x64' -Recurse | Select-Object -ExpandProperty Name
          $fileList = ($files -join ", ")
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## release-exe - summary"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ("- Artifact: `EvoClean-preview-win-x64.zip`")
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ("- Size: $size bytes")
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ("- SHA256: $sha256")
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ("- Files: $fileList")

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EvoClean-preview-win-x64
          path: |
            EvoClean-preview-win-x64.zip
            EvoClean-preview-win-x64.zip.sha256
          retention-days: 30

      - name: Create draft pre-release
        shell: pwsh
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $runNumber = "${{ github.run_number }}"
          $tagName = "preview-$runNumber"
          $sha = "${{ github.sha }}"
          $zip = "EvoClean-preview-win-x64.zip"
          $sha256 = "EvoClean-preview-win-x64.zip.sha256"
          gh release create "$tagName" --draft --prerelease --target "$sha" --title "EVO Clean preview $runNumber" --notes "Draft pre-release generated by release-exe (run $runNumber). SHA: $sha" "$zip" "$sha256"
          Write-Host "Draft pre-release created: $tagName"
