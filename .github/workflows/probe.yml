name: probe

on:
  workflow_dispatch:
  push:
    branches:
      - arena/ab2d6de7-evo-optimizer-on

permissions:
  contents: write
  checks: write

jobs:
  probe:
    runs-on: windows-latest
    env:
      REPORT_DIR: ci-report
      REPORT_FILE: ci-report/probe.txt
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        continue-on-error: true

      - name: dotnet SDKs y runtimes
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force -Path ci-report | Out-Null
          "=== dotnet SDKs y runtimes ===" | Tee-Object -FilePath ci-report/probe.txt -Append
          & { dotnet --list-sdks; dotnet --list-runtimes } 2>&1 | Tee-Object -FilePath ci-report/probe.txt -Append

      - name: PowerShell version
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force -Path ci-report | Out-Null
          "=== PowerShell version ===" | Tee-Object -FilePath ci-report/probe.txt -Append
          & { $PSVersionTable.PSVersion.ToString() } 2>&1 | Tee-Object -FilePath ci-report/probe.txt -Append

      - name: Windows build info (registro)
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force -Path ci-report | Out-Null
          "=== Windows build info (registro) ===" | Tee-Object -FilePath ci-report/probe.txt -Append
          & { (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion') | Select-Object CurrentBuildNumber,UBR,EditionID,DisplayVersion | Format-List * } 2>&1 | Tee-Object -FilePath ci-report/probe.txt -Append

      - name: reg.exe funciona
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force -Path ci-report | Out-Null
          "=== reg.exe funciona ===" | Tee-Object -FilePath ci-report/probe.txt -Append
          & { reg query "HKCU\Software" /s /f nada; "EXITCODE=$LASTEXITCODE" } 2>&1 | Tee-Object -FilePath ci-report/probe.txt -Append

      - name: whoami y admin
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force -Path ci-report | Out-Null
          "=== whoami y admin ===" | Tee-Object -FilePath ci-report/probe.txt -Append
          & { whoami /groups; whoami /user; $i=[Security.Principal.WindowsIdentity]::GetCurrent(); $p=New-Object Security.Principal.WindowsPrincipal($i); "IsAdmin="+$p.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator); "User="+$i.Name; "IL="+($i.Groups|?{$_.Value -match "^S-1-16-"}|%{$_.Value}) } 2>&1 | Tee-Object -FilePath ci-report/probe.txt -Append

      - name: winget y choco
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force -Path ci-report | Out-Null
          "=== winget y choco ===" | Tee-Object -FilePath ci-report/probe.txt -Append
          & { try{winget --version}catch{"winget NO: $_"}; "winget_exit=$LASTEXITCODE"; try{choco --version}catch{"choco NO: $_"}; "choco_exit=$LASTEXITCODE" } 2>&1 | Tee-Object -FilePath ci-report/probe.txt -Append

      - name: git y python
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force -Path ci-report | Out-Null
          "=== git y python ===" | Tee-Object -FilePath ci-report/probe.txt -Append
          & { git --version; python --version; "python_exit=$LASTEXITCODE" } 2>&1 | Tee-Object -FilePath ci-report/probe.txt -Append

      - name: arquitectura
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force -Path ci-report | Out-Null
          "=== arquitectura ===" | Tee-Object -FilePath ci-report/probe.txt -Append
          & { "PROCESSOR_ARCHITECTURE="+$env:PROCESSOR_ARCHITECTURE; [Environment]::OSVersion.VersionString; "RunnerOS="+$env:RUNNER_OS } 2>&1 | Tee-Object -FilePath ci-report/probe.txt -Append

      - name: Publicar ci-report en rama huérfana
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force -Path $env:REPORT_DIR | Out-Null
          $meta = @(
            "job_status=$env:JOB_STATUS"
            "runner=$env:RUNNER_NAME"
            "run_id=$env:GITHUB_RUN_ID"
            "run_attempt=$env:GITHUB_RUN_ATTEMPT"
            "sha=$env:GITHUB_SHA"
            "ref=$env:GITHUB_REF"
            "generated_utc=" + (Get-Date).ToUniversalTime().ToString('s') + "Z"
          ) -join "`n"
          Add-Content -Path $env:REPORT_FILE -Value $meta -Encoding utf8
          "=== contenido de $env:REPORT_FILE ==="
          Get-Content $env:REPORT_FILE | Out-String

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-report 2>&1 | Out-String
          git rm -rf --cached . 2>&1 | Out-String
          git add -f $env:REPORT_DIR 2>&1 | Out-String
          git commit -m "ci-report: run $env:GITHUB_RUN_ID" 2>&1 | Out-String
          git push --force origin ci-report 2>&1 | Out-String
          "PUSH_EXITCODE=$LASTEXITCODE"

      - name: Resumen siempre visible
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          "JOB_STATUS=$env:JOB_STATUS"
