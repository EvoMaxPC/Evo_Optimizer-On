            echo "DETERMINISMO PASO 12 ROTO" | tee ci-out/paso12-determinism.txt
            exit 1
          fi
          echo "determinismo paso 12: OK (mismos sha256 en dos ejecuciones)" \
            | tee ci-out/paso12-determinism.txt

          # Los dos medidores comparan contra el TSV versionado y fallan si difiere.
          python3 tools/ledger_extract/measure_capability_completeness.py --check
          python3 tools/ledger_extract/measure_toggle_states.py --check
          python3 tools/ledger_extract/build_section9_catalog.py --check
          python3 tools/ledger_extract/build_section10_catalog.py --check
          python3 tools/ledger_extract/audit_catalog_values.py
          python3 tools/ledger_extract/verify_catalog_coverage.py

          cp ci-out/paso12-sha-run1.txt ci-out/paso12-sha.txt
          python3 tools/ledger_extract/measure_capability_completeness.py --json \
            > ci-out/paso12-r1.json
          python3 tools/ledger_extract/measure_toggle_states.py --json \
            > ci-out/paso12-toggle-states.json
          python3 tools/ledger_extract/verify_catalog_coverage.py --json \
            > ci-out/paso12-coverage.json
          python3 tools/ledger_extract/audit_catalog_values.py --json \
            > ci-out/paso12-audit.json
          python3 - <<'PYEOF'
          import json, sys
          r1 = json.load(open("ci-out/paso12-r1.json", encoding="utf-8"))
          t3 = json.load(open("ci-out/paso12-toggle-states.json", encoding="utf-8"))
          cov = json.load(open("ci-out/paso12-coverage.json", encoding="utf-8"))
          aud = json.load(open("ci-out/paso12-audit.json", encoding="utf-8"))
          sec9 = json.load(open("catalog/capabilities/section9_system_registry.json", encoding="utf-8"))
          sec10 = json.load(open("catalog/capabilities/section10_explorer_ui.json", encoding="utf-8"))
          caps9 = {c["id"]: c for c in sec9["capabilities"]}
          caps10 = {c["id"]: c for c in sec10["capabilities"]}
          acts9 = sum(len(c["actions"]) for c in caps9.values())
          acts10 = sum(len(c["actions"]) for c in caps10.values())
          creates = {cap: [a for a in c["actions"] if a["type"] == "registryCreateKey"]
                     for cap, c in list(caps9.items()) + list(caps10.items())}
          creates = {k: v for k, v in creates.items() if v}
          specified9 = sorted(c["id"] for c in caps9.values() if c["state"] == "Specified")
          print("R1:", r1["capacidades"], "caps | Implemented", r1["implemented"],
                "| Specified", r1["specified"], "| violaciones", r1["violaciones_r1"])
          print("T3:", t3["veredicto"], "| con toggle", t3["capacidades_con_toggle"],
                "| pendientes", len(t3["pendientes"]),
                "| contrarios", t3["contrarios_declarados"])
          print("cobertura:", cov["capacidades"], "| huecos", cov["huecos"],
                "| cubiertas", cov["cubiertas"])
          print("auditoria:", aud["filas"], "| sin excepcion", aud["sin_excepcion"],
                "| veredicto", "OK" if aud["ok"] else "FALLO")
          print("seccion 9:", len(caps9), "caps /", acts9, "acciones |",
                "seccion 10:", len(caps10), "caps /", acts10, "acciones")
          print("registryCreateKey:", sorted(creates))
          ok = (r1["capacidades"] == 88
                and r1["violaciones_r1"] == []
                and r1["implemented"] + r1["specified"] == 88
                and t3["veredicto"] == "OK"
                and t3["contrarios_declarados"] == []
                and cov["capacidades"] == 88
                and cov["huecos"] == 0
                and cov["huecos_no_declarados"] == 0
                and aud["filas"] == 197
                and aud["sin_excepcion"] == 0
                and len(caps9) == 19 and acts9 == 47
                and len(caps10) == 30 and acts10 == 60
                # T2: los tres AddKey pendientes del paso 11 ya son acciones, y
                # cada una es UNICA en su capacidad (crear dos veces la misma
                # clave no seria idempotente).
                and sorted(creates) == ["explorer.home.restore",
                                        "system.network.location-wizard.disable"]
                and all(len(v) == 1 for v in creates.values())
                # La lista cerrada de Specified de la seccion 9 (R1 + R3).
                # Paso 12c: ntp-servers y oem-information también vuelven a
                # Specified (R1: el pin hace más de lo declarado), así que son 6.
                and specified9 == ["system.hibernation.hide",
                                   "system.location.consent-deny",
                                   "system.mitigations.disable",
                                   "system.oem-information.identify",
                                   "system.registry-backup.enable",
                                   "system.time.ntp-servers"]
                # R3: lo que INSTALA algo persistente con privilegios altos (una
                # tarea programada o un servicio) no puede ser Safe ni quedar sin
                # confirmacion. Las escrituras de registro quedan fuera del
                # alcance de R3 que declaran los generadores (ver paso12.md).
                and all(c["risk"] != "Safe" and c["confirmation"] != "None"
                        for c in list(caps9.values()) + list(caps10.values())
                        if c["privilege"] == "Admin"
                        and any(a["type"] in ("taskCreate", "service")
                                for a in c["actions"])))
          sys.exit(0 if ok else 1)
          PYEOF
          cp inventory/ledger/capability-completeness.tsv ci-out/
          cp inventory/ledger/toggle-state-audit.tsv ci-out/

