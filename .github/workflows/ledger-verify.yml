name: ledger-verify

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/ledger_extract/**'
      - 'inventory/**'
      - 'docs/inventory-recon/**'
      - 'src/**'
      - 'tests/**'
      - 'catalog/**'
      - 'Directory.Build.props'
      - 'Evo.sln'
      - 'global.json'
      - 'tools/dotnet_tools/**'
      - 'docs/reports/**'
      - '.github/workflows/**'
    branches-ignore:
      - ci-report

permissions:
  contents: write

concurrency:
  group: ledger-verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: ledger-verify (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LABEL: ledger-verify
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Instalar pytest y pyyaml
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --break-system-packages pytest pyyaml
          python3 -c "import pytest, yaml; print('pytest', pytest.__version__, '| pyyaml', yaml.__version__)"

      - name: Reproducir upstream en el SHA fijado
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ledger_extract/fetch_upstream.py --dest /tmp/upstream
          python3 tools/ledger_extract/list_files.py --dest /tmp/upstream

      - name: Suite pytest
        shell: bash
        run: |
          mkdir -p ci-out
          set +e
          python3 -m pytest tools/ledger_extract/tests/ tests/ -q 2>&1 | tee ci-out/pytest.txt
          rc=${PIPESTATUS[0]}
          echo "pytest_exit=$rc" | tee -a ci-out/pytest.txt
          exit $rc

      - name: partition_check
        if: always()
        shell: bash
        run: |
          mkdir -p ci-out
          set +e
          python3 tools/ledger_extract/partition_check.py 2>&1 | tee ci-out/partition_check.txt
          rc=${PIPESTATUS[0]}
          echo "partition_check_exit=$rc" | tee -a ci-out/partition_check.txt
          # copia también los resultados por fichero
          for f in inventory/partition/results/*.tsv; do
            [ -f "$f" ] && cp "$f" "ci-out/$(basename "$f")"
          done
          exit $rc

      - name: Extractor de WinUtil (determinismo)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-out
          python3 tools/ledger_extract/extract_winutil_config.py
          python3 tools/ledger_extract/extract_winutil_functions.py
          cp inventory/ledger/winutil-items.tsv ci-out/winutil-items.tsv
          cp inventory/ledger/winutil-apps.tsv ci-out/winutil-apps.tsv
          cp inventory/ledger/winutil-functions.tsv ci-out/winutil-functions.tsv
          sha256sum inventory/ledger/*.tsv | tee ci-out/ledger-sha-run1.txt
          # segunda ejecución: debe producir bytes idénticos
          python3 tools/ledger_extract/extract_winutil_config.py
          python3 tools/ledger_extract/extract_winutil_functions.py
          sha256sum inventory/ledger/*.tsv | tee ci-out/ledger-sha-run2.txt
          if ! diff -u ci-out/ledger-sha-run1.txt ci-out/ledger-sha-run2.txt; then
            echo "DETERMINISMO ROTO: las dos ejecuciones difieren" | tee ci-out/determinism.txt
            exit 1
          fi
          echo "determinismo: OK (mismos sha256 en dos ejecuciones)" | tee ci-out/determinism.txt

      - name: Cobertura de extract (winutil)
        if: always()
        shell: bash
        run: |
          set +e
          python3 tools/ledger_extract/coverage_check.py 2>&1 | tee ci-out/coverage.txt
          echo "coverage_exit=${PIPESTATUS[0]}" | tee -a ci-out/coverage.txt

      - name: Esquema de config
        if: always()
        shell: bash
        run: |
          python3 tools/ledger_extract/config_schema.py 2>&1 | tee ci-out/config-schema.txt

      - name: Extractor de Atlas (determinismo)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ledger_extract/extract_atlas_files.py
          cp inventory/ledger/atlas-files.tsv ci-out/atlas-files.tsv
          cp inventory/ledger/atlas-reg-entries.tsv ci-out/atlas-reg-entries.tsv
          sha256sum inventory/ledger/atlas-*.tsv | tee ci-out/atlas-sha-run1.txt
          python3 tools/ledger_extract/extract_atlas_files.py
          sha256sum inventory/ledger/atlas-*.tsv | tee ci-out/atlas-sha-run2.txt
          if ! diff -u ci-out/atlas-sha-run1.txt ci-out/atlas-sha-run2.txt; then
            echo "DETERMINISMO ATLAS ROTO" | tee ci-out/atlas-determinism.txt
            exit 1
          fi
          echo "determinismo atlas: OK" | tee ci-out/atlas-determinism.txt

      - name: Cobertura de extract (atlas)
        if: always()
        shell: bash
        run: |
          set +e
          python3 tools/ledger_extract/coverage_check_atlas.py 2>&1 | tee ci-out/coverage-atlas.txt
          echo "coverage_atlas_exit=${PIPESTATUS[0]}" | tee -a ci-out/coverage-atlas.txt

      - name: Extractor de toggles de Atlas (determinismo + cruces)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ledger_extract/extract_atlas_toggles.py
          cp inventory/ledger/atlas-toggles.tsv ci-out/atlas-toggles.tsv
          cp inventory/ledger/atlas-tweak-files.tsv ci-out/atlas-tweak-files.tsv
          sha256sum inventory/ledger/atlas-toggles.tsv \
                    inventory/ledger/atlas-tweak-files.tsv \
            | tee ci-out/toggles-sha-run1.txt
          python3 tools/ledger_extract/extract_atlas_toggles.py
          sha256sum inventory/ledger/atlas-toggles.tsv \
                    inventory/ledger/atlas-tweak-files.tsv \
            | tee ci-out/toggles-sha-run2.txt
          if ! diff -u ci-out/toggles-sha-run1.txt ci-out/toggles-sha-run2.txt; then
            echo "DETERMINISMO TOGGLES ROTO" | tee ci-out/toggles-determinism.txt
            exit 1
          fi
          echo "determinismo toggles: OK" | tee ci-out/toggles-determinism.txt
          python3 tools/ledger_extract/extract_atlas_toggles.py --json \
            > ci-out/toggles-cross.json
          python3 - <<'PYEOF'
          import json, sys
          d = json.load(open("ci-out/toggles-cross.json", encoding="utf-8"))
          c = d["cross"]
          bad = c["duplicate_ids"] or c["unnamed"] or c["broken_refs"]
          print("toggles:", c["toggles"], "| prediccion 91:",
                "OK" if c["prediction_ok"] else "DIFIERE")
          print("ids duplicados:", len(c["duplicate_ids"]),
                "| sin etiqueta:", len(c["unnamed"]),
                "| refs rotas:", len(c["broken_refs"]))
          sys.exit(1 if bad else 0)
          PYEOF

      - name: Extractores de 4c (determinismo + cruce)
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2; do
            python3 tools/ledger_extract/extract_atlas_functions.py
            python3 tools/ledger_extract/extract_atlas_bridge.py
            python3 tools/ledger_extract/extract_atlas_toggle_ops.py
            python3 tools/ledger_extract/extract_atlas_tweak_ops.py
            sha256sum inventory/ledger/atlas-functions.tsv \
                      inventory/ledger/atlas-toggle-bridge.tsv \
                      inventory/ledger/atlas-toggle-ops.tsv \
                      inventory/ledger/atlas-tweak-ops.tsv \
              > "ci-out/paso4c-sha-run${i}.txt"
            cp inventory/ledger/atlas-functions.tsv ci-out/atlas-functions.tsv
            cp inventory/ledger/atlas-toggle-bridge.tsv ci-out/atlas-toggle-bridge.tsv
            cp inventory/ledger/atlas-toggle-ops.tsv ci-out/atlas-toggle-ops.tsv
            cp inventory/ledger/atlas-tweak-ops.tsv ci-out/atlas-tweak-ops.tsv
          done
          if ! diff -u ci-out/paso4c-sha-run1.txt ci-out/paso4c-sha-run2.txt; then
            echo "DETERMINISMO 4C ROTO" | tee ci-out/paso4c-determinism.txt
            exit 1
          fi
          echo "determinismo 4c: OK" | tee ci-out/paso4c-determinism.txt
          python3 tools/ledger_extract/cross_atlas_ops.py --json \
            | tee ci-out/paso4c-cross.json
          python3 - <<'PYEOF'
          import json, sys
          d = json.load(open("ci-out/paso4c-cross.json", encoding="utf-8"))
          print("ops catalogo:", d["toggle_ops_total"],
                "| con hive+key:", d["toggle_ops_con_hive_y_key"])
          print("ops psd1:", d["tweak_ops_total"],
                "| claves distintas:", d["claves_normalizadas_tweak"])
          print("veredicto:", d["veredicto"])
          if d["toggle_ops_con_hive_y_key"] != 0:
              print("INESPERADO: el catalogo ahora declara claves; revisar el cruce")
              sys.exit(1)
          PYEOF
          for f in atlas-functions atlas-toggle-bridge atlas-toggle-ops atlas-tweak-ops; do
            echo "$f: $(($(wc -l < inventory/ledger/$f.tsv) - 1)) filas"
          done | tee ci-out/paso4c-counts.txt

      - name: Extractores de 4d (determinismo + cifras)
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2; do
            python3 tools/ledger_extract/extract_atlas_effects.py
            python3 tools/ledger_extract/extract_atlas_toggle_effects.py
            python3 tools/ledger_extract/extract_winutil_ops.py
            sha256sum inventory/ledger/atlas-effects.tsv \
                      inventory/ledger/atlas-toggle-effects.tsv \
                      inventory/ledger/atlas-psd1-refs.tsv \
                      inventory/ledger/winutil-tweak-ops.tsv \
                      inventory/ledger/winutil-feature-ops.tsv \
                      inventory/ledger/winutil-appx-ops.tsv \
              > "ci-out/paso4d-sha-run${i}.txt"
            for f in atlas-effects atlas-toggle-effects atlas-psd1-refs \
                     winutil-tweak-ops winutil-feature-ops winutil-appx-ops; do
              cp "inventory/ledger/$f.tsv" "ci-out/$f.tsv"
            done
          done
          if ! diff -u ci-out/paso4d-sha-run1.txt ci-out/paso4d-sha-run2.txt; then
            echo "DETERMINISMO 4D ROTO" | tee ci-out/paso4d-determinism.txt
            exit 1
          fi
          echo "determinismo 4d: OK" | tee ci-out/paso4d-determinism.txt
          python3 tools/ledger_extract/extract_atlas_effects.py --json \
            > ci-out/paso4d-effects.json
          python3 tools/ledger_extract/extract_atlas_toggle_effects.py --json \
            > ci-out/paso4d-toggle-effects.json
          python3 tools/ledger_extract/extract_winutil_ops.py --json \
            > ci-out/paso4d-winutil-ops.json
          python3 - <<'PYEOF'
          import json, sys
          eff = json.load(open("ci-out/paso4d-effects.json", encoding="utf-8"))
          tog = json.load(open("ci-out/paso4d-toggle-effects.json", encoding="utf-8"))
          win = json.load(open("ci-out/paso4d-winutil-ops.json", encoding="utf-8"))
          print("efectos atlas:", eff["efectos"], "| por tipo:", len(eff["por_tipo"]))
          print("filas toggle-effects:", tog["filas"], "| sin efecto:", tog["filas_sin_efecto"])
          print("psd1 sin referencia:", tog["psd1"]["sin_ninguna"])
          print("winutil tweak-ops:", win["tweaks"]["filas"],
                "| feature:", win["features"]["filas"],
                "| appx:", win["appx"]["filas"])
          ok = (eff["efectos"] > 0 and tog["filas"] == 92
                and win["tweaks"]["filas"] > 0)
          sys.exit(0 if ok else 1)
          PYEOF

      - name: Extractores de 4e (manifiesto + conciliacion, determinismo)
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2; do
            python3 tools/ledger_extract/extract_atlas_manifest.py
            python3 tools/ledger_extract/build_conciliacion.py
            sha256sum inventory/ledger/atlas-manifest.tsv \
                      inventory/ledger/conciliacion-borrador.tsv \
              > "ci-out/paso4e-sha-run${i}.txt"
            cp inventory/ledger/atlas-manifest.tsv ci-out/atlas-manifest.tsv
            cp inventory/ledger/conciliacion-borrador.tsv ci-out/conciliacion-borrador.tsv
          done
          if ! diff -u ci-out/paso4e-sha-run1.txt ci-out/paso4e-sha-run2.txt; then
            echo "DETERMINISMO 4E ROTO" | tee ci-out/paso4e-determinism.txt
            exit 1
          fi
          echo "determinismo 4e: OK" | tee ci-out/paso4e-determinism.txt
          python3 - <<'PYEOF'
          import csv
          rows = list(csv.DictReader(open("inventory/ledger/conciliacion-borrador.tsv",
                                         encoding="utf-8"), delimiter="\t"))
          man = list(csv.DictReader(open("inventory/ledger/atlas-manifest.tsv",
                                         encoding="utf-8"), delimiter="\t"))
          print("manifiesto:", len(man), "entradas | enabled:",
                sum(1 for r in man if r["enabled"] == "true"))
          print("conciliacion:", len(rows), "filas")
          bad = [r for r in rows if "Mapped" in r.values()]
          print("filas con Mapped:", len(bad))
          assert len(rows) == 588, "la conciliacion debe tener 588 filas"
          assert not bad, "prohibido Mapped en el borrador"
          assert len(man) == 182, "el manifiesto debe tener 182 entradas"
          PYEOF

      - name: Paso 8b (auditoria de valores + mapa upstream, determinismo)
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2; do
            python3 tools/ledger_extract/audit_catalog_values.py | tee "ci-out/paso8b-audit-run${i}.txt"
            python3 tools/ledger_extract/verify_catalog_coverage.py | tee "ci-out/paso8b-coverage-run${i}.txt"
            python3 tools/ledger_extract/build_upstream_capability_map.py | tee "ci-out/paso8b-map-run${i}.txt"
            sha256sum inventory/ledger/catalog-value-audit.tsv \
                      inventory/ledger/upstream-capability-map.tsv \
              > "ci-out/paso8b-sha-run${i}.txt"
          done
          if ! diff -u ci-out/paso8b-sha-run1.txt ci-out/paso8b-sha-run2.txt; then
            echo "DETERMINISMO PASO 8B ROTO" | tee ci-out/paso8b-determinism.txt
            exit 1
          fi
          echo "determinismo paso 8b: OK" | tee ci-out/paso8b-determinism.txt
          cp inventory/ledger/catalog-value-audit.tsv ci-out/
          cp inventory/ledger/upstream-capability-map.tsv ci-out/
          python3 tools/ledger_extract/audit_catalog_values.py --json \
            > ci-out/paso8b-audit.json
          python3 tools/ledger_extract/build_upstream_capability_map.py --json \
            > ci-out/paso8b-map.json
          # gate en modo informativo: el pending del mapa no bloquea la fase 0
          python3 tools/ledger_extract/coverage_gate.py --gate phase0 \
            | tee ci-out/paso8b-gate-phase0.txt
          python3 tools/ledger_extract/coverage_gate.py --gate beta --informational \
            | tee ci-out/paso8b-gate-beta.txt
          python3 - <<'PYEOF'
          import json, sys
          a = json.load(open("ci-out/paso8b-audit.json", encoding="utf-8"))
          m = json.load(open("ci-out/paso8b-map.json", encoding="utf-8"))
          print("acciones auditadas:", a["filas"], "| distribucion:", a["distribucion"])
          print("desviaciones sin excepcion:", a["sin_excepcion"])
          print("mapa:", m["filas"], "| cobertura:", m["cobertura"])
          print("source x status:", m["source_x_status"])
          # Las cifras suben con el catalogo: 105 acciones de registro y 39
          # capacidades en el paso 8c (antes 104 y 37). No se fijan a la baja.
          ok = (a["sin_excepcion"] == 0 and a["filas"] >= 104
                and m["filas"] == 435 and m["cobertura"]["covered"] >= 37)
          sys.exit(0 if ok else 1)
          PYEOF

      - name: Paso 8c (interruptores, seccion por categoria y plan de oleadas)
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2; do
            python3 tools/ledger_extract/extract_winutil_ops.py | tee "ci-out/paso8c-ops-run${i}.txt"
            python3 tools/ledger_extract/build_category_section_map.py | tee "ci-out/paso8c-cat-run${i}.txt"
            python3 tools/ledger_extract/audit_catalog_values.py | tee "ci-out/paso8c-audit-run${i}.txt"
            python3 tools/ledger_extract/build_upstream_capability_map.py > "ci-out/paso8c-map-run${i}.txt"
            python3 tools/ledger_extract/build_wave_plan.py > "ci-out/paso8c-plan-run${i}.txt"
            sha256sum inventory/ledger/winutil-tweak-ops.tsv \
                      inventory/ledger/catalog-value-audit.tsv \
                      inventory/ledger/upstream-capability-map.tsv \
                      inventory/partition/category-section-map.tsv \
                      docs/reports/plan-oleadas.md \
              > "ci-out/paso8c-sha-run${i}.txt"
          done
          if ! diff -u ci-out/paso8c-sha-run1.txt ci-out/paso8c-sha-run2.txt; then
            echo "DETERMINISMO PASO 8C ROTO" | tee ci-out/paso8c-determinism.txt
            exit 1
          fi
          echo "determinismo paso 8c: OK" | tee ci-out/paso8c-determinism.txt
          python3 tools/ledger_extract/build_wave_plan.py --check
          cp inventory/ledger/winutil-tweak-ops.tsv ci-out/
          cp inventory/ledger/catalog-value-audit.tsv ci-out/
          cp inventory/ledger/upstream-capability-map.tsv ci-out/
          cp inventory/partition/category-section-map.tsv ci-out/
          cp docs/reports/plan-oleadas.md ci-out/
          python3 tools/ledger_extract/audit_catalog_values.py --json \
            > ci-out/paso8c-audit.json
          python3 tools/ledger_extract/build_upstream_capability_map.py --json \
            > ci-out/paso8c-map.json
          python3 tools/ledger_extract/build_category_section_map.py --json \
            > ci-out/paso8c-cat.json
          python3 - <<'PYEOF'
          import json, sys
          a = json.load(open("ci-out/paso8c-audit.json", encoding="utf-8"))
          m = json.load(open("ci-out/paso8c-map.json", encoding="utf-8"))
          c = json.load(open("ci-out/paso8c-cat.json", encoding="utf-8"))
          print("audit:", a["filas"], "acciones |", a["distribucion"])
          print("sin excepcion:", a["sin_excepcion"], "| excepciones:", a["excepciones"])
          print("mapa:", m["filas"], "| basis:", m["por_basis"])
          print("categorias:", c["categorias"], "| items:", c["items"],
                "| con seccion:", c["asignadas"], "| mixed:", c["mixed"])
          # 140 es el valor medido con las 49 categorias del pin; lo que no se
          # admite es volver al 361 del paso 8b (ni dejar categorias sin asignar).
          ok = (a["sin_excepcion"] == 0 and m["filas"] == 435
                and m["por_basis"].get("none", 0) < 361
                and c["unassigned"] == 0 and c["categorias"] == 49)
          sys.exit(0 if ok else 1)
          PYEOF

      - name: Paso 8d (claves de toggle, seccion por item, plan y rangos)
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2; do
            python3 tools/ledger_extract/extract_atlas_toggle_keys.py \
              | tee "ci-out/paso8d-togglekeys-run${i}.txt"
            python3 tools/ledger_extract/build_item_section_map.py \
              | tee "ci-out/paso8d-items-run${i}.txt"
            python3 tools/ledger_extract/build_upstream_capability_map.py \
              > "ci-out/paso8d-map-run${i}.txt"
            python3 tools/ledger_extract/build_wave_plan.py \
              > "ci-out/paso8d-plan-run${i}.txt"
            sha256sum inventory/ledger/atlas-toggle-keys.tsv \
                      inventory/partition/item-section-map.tsv \
                      inventory/ledger/upstream-capability-map.tsv \
                      docs/reports/plan-oleadas.md \
              > "ci-out/paso8d-sha-run${i}.txt"
          done
          if ! diff -u ci-out/paso8d-sha-run1.txt ci-out/paso8d-sha-run2.txt; then
            echo "DETERMINISMO PASO 8D ROTO" | tee ci-out/paso8d-determinism.txt
            exit 1
          fi
          echo "determinismo paso 8d: OK" | tee ci-out/paso8d-determinism.txt
          python3 tools/ledger_extract/build_wave_plan.py --check
          cp inventory/ledger/atlas-toggle-keys.tsv ci-out/
          cp inventory/partition/item-section-map.tsv ci-out/
          cp inventory/ledger/upstream-capability-map.tsv ci-out/
          cp docs/reports/plan-oleadas.md ci-out/
          python3 tools/ledger_extract/build_item_section_map.py --json \
            > ci-out/paso8d-items.json
          python3 tools/ledger_extract/build_upstream_capability_map.py --json \
            > ci-out/paso8d-map.json
          python3 tools/ledger_extract/extract_atlas_toggle_keys.py --json \
            > ci-out/paso8d-togglekeys.json
          python3 - <<'PYEOF'
          import json, sys
          items = json.load(open("ci-out/paso8d-items.json", encoding="utf-8"))
          mapa = json.load(open("ci-out/paso8d-map.json", encoding="utf-8"))
          keys = json.load(open("ci-out/paso8d-togglekeys.json", encoding="utf-8"))
          print("items:", items["filas"], "| con seccion:", items["asignadas"],
                "| unassigned:", items["unassigned"])
          print("basis:", items["por_basis"])
          print("claves de toggle:", keys["filas"], "|", keys["por_hive"])
          print("mapa upstream: basis:", mapa["por_basis"])
          print("pending sin seccion:", mapa["pending_por_seccion"].get("(sin seccion)", 0))
          ok = (items["filas"] == 435
                and items["asignadas"] + items["unassigned"] == 435
                and mapa["filas"] == 435
                and mapa["por_basis"].get("none", 0) < 140
                and items["por_basis"].get("manual-review", 0) < 140
                and keys["filas"] > 0)
          sys.exit(0 if ok else 1)
          PYEOF

      - name: Paso 9 (catalogo de la seccion 10, cobertura y doble ejecucion)
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2; do
            python3 tools/ledger_extract/build_section10_catalog.py \
              | tee "ci-out/paso9-catalog-run${i}.txt"
            python3 tools/ledger_extract/generate_coverage_matrix.py \
              > "ci-out/paso9-matrix-run${i}.txt"
            python3 tools/ledger_extract/audit_catalog_values.py \
              > "ci-out/paso9-audit-run${i}.txt"
            python3 tools/ledger_extract/verify_catalog_coverage.py \
              > "ci-out/paso9-coverage-run${i}.txt"
            python3 tools/ledger_extract/build_wave_plan.py \
              > "ci-out/paso9-plan-run${i}.txt"
            python3 tools/ledger_extract/build_build_ranges_report.py \
              > "ci-out/paso9-ranges-run${i}.txt"
            sha256sum catalog/capabilities/section10_explorer_ui.json \
                      inventory/ledger/catalog-value-audit.tsv \
                      inventory/ledger/upstream-capability-map.tsv \
                      inventory/ledger/inventory-reconciliation.tsv \
                      docs/reports/matriz-cobertura.md \
                      docs/reports/plan-oleadas.md \
                      docs/reports/rangos-build.md \
              > "ci-out/paso9-sha-run${i}.txt"
          done
